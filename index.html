    <meta name="description" content="TerraPulse: NASA Earth System Trend Detective & Climate-Health Compass. Empowering physicians and policy makers to detect 30-year climate shifts, reverse brain drain, and protect Egypt's vulnerable communities." />

    <script>
      (function() {
        try {
          var theme = localStorage.getItem('terrapulse_theme') || 'light';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
